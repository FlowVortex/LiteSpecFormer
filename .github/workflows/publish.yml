name: Publish to PyPI

# Publishes the package when a GitHub Release is published.
# One-time setup on https://pypi.org/manage/account/publishing/ :
#   Owner: the GitHub user or organization
#   Repository: LiteSpecFormer
#   Workflow: publish.yml
#   Environment: pypi
# The release tag must match [project].version in pyproject.toml, with or without a leading "v".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/unittest.yml

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/litespecformer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the release tag against the package version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}."
            exit 1
          fi

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
