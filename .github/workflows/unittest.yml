name: Unit tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: unittest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          # The CPU index publishes 2.10.0+cpu, which does not satisfy torch==2.10.0.
          python -m pip install "torch==2.10.0+cpu" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python - <<'PY'
          import tomllib
          from pathlib import Path

          dependencies = tomllib.load(Path("pyproject.toml").open("rb"))["project"]["dependencies"]
          requirements = [item for item in dependencies if not item.startswith("torch")]
          Path("/tmp/requirements.txt").write_text("\n".join(requirements) + "\n")
          PY
          python -m pip install --no-deps .
          python -m pip install -r /tmp/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
